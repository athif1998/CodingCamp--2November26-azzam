<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium TodoList Life Dashboard - An integrated productivity environment">
    <title>Premium TodoList Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <h1>Premium TodoList Life Dashboard</h1>
            <p>Stay productive, organized, and focused</p>
        </header>

        <!-- Notification Area -->
        <div id="notification-area"></div>

        <!-- Main Dashboard -->
        <div class="dashboard">
            <!-- Greeting Component -->
            <div class="card">
                <div id="greeting-display">
                    <h1>Good Morning</h1>
                    <p class="date">Monday, January 1, 2024</p>
                    <p class="time">9:00 AM</p>
                </div>
            </div>

            <!-- Timer Component -->
            <div class="card">
                <h2>Focus Timer</h2>
                <div id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button id="timer-start">Start</button>
                    <button id="timer-pause">Pause</button>
                    <button id="timer-resume">Resume</button>
                    <button id="timer-reset">Reset</button>
                </div>
            </div>

            <!-- TodoList Component -->
            <div class="card">
                <h2>My Tasks</h2>
                <form id="task-form" class="form-group">
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="Add a new task..." 
                        autocomplete="off"
                    >
                    <button type="submit">Add</button>
                </form>
                <ul id="task-list"></ul>
            </div>

            <!-- QuickLinks Component -->
            <div class="card">
                <h2>Quick Links</h2>
                <form id="link-form" class="form-group">
                    <input 
                        type="text" 
                        id="link-url" 
                        placeholder="URL..." 
                        autocomplete="off"
                    >
                    <input 
                        type="text" 
                        id="link-label" 
                        placeholder="Label..." 
                        autocomplete="off"
                    >
                    <button type="submit">Add</button>
                </form>
                <div id="links-grid"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
