<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium TodoList Life Dashboard - An integrated productivity environment">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">

        <!-- ── Greeting Header ─────────────────────── -->
        <header id="header">
            <div id="greeting-display">
                <h1>Good Morning</h1>
                <p class="date">Monday, January 1, 2024</p>
                <p class="time">9:00 AM</p>
            </div>
        </header>

        <!-- ── Notifications ──────────────────────── -->
        <div id="notification-area"></div>

        <!-- ── Main Grid ───────────────────────────── -->
        <div class="dashboard">

            <!-- Focus Timer -->
            <div class="card">
                <h2>Focus Timer</h2>
                <div id="timer-display">25:00.00</div>
                <div class="timer-controls">
                    <button id="timer-start">Start</button>
                    <button id="timer-pause">Pause</button>
                    <button id="timer-resume">Resume</button>
                    <button id="timer-reset">Reset</button>
                </div>
            </div>

            <!-- My Tasks -->
            <div class="card">
                <h2>My Tasks</h2>
                <form id="task-form" class="form-group">
                    <input
                        type="text"
                        id="task-input"
                        placeholder="Add a new task…"
                        autocomplete="off"
                    >
                    <button type="submit">Add</button>
                </form>
                <ul id="task-list"></ul>
            </div>

            <!-- Quick Links -->
            <div class="card">
                <h2>Quick Links</h2>
                <form id="link-form">
                    <input
                        type="text"
                        id="link-url"
                        placeholder="https://..."
                        autocomplete="off"
                    >
                    <input
                        type="text"
                        id="link-label"
                        placeholder="Label"
                        autocomplete="off"
                    >
                    <button type="submit">Add</button>
                </form>
                <div id="links-grid"></div>
            </div>

        </div><!-- /.dashboard -->
    </div><!-- /#app -->

    <script src="js/app.js"></script>
</body>
</html>
